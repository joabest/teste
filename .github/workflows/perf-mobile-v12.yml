name: Mobile critical path optimizer v12

on:
  push:
    paths:
      - '.github/workflows/perf-mobile-v12.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - name: Inline CSS and defer Next hydration on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          before = len(s.encode('utf-8'))

          main_path = Path('_next/static/chunks/14xjhfymotqh9.css')
          font_path = Path('_next/static/chunks/17jk821lzpjxj.css')
          mirror_path = Path('mirror-fidelity.css')

          main_css = main_path.read_text(encoding='utf-8').replace('url(../media/', 'url(/_next/static/media/')
          font_css = font_path.read_text(encoding='utf-8').replace('url(../media/', 'url(/_next/static/media/')
          mirror_css = mirror_path.read_text(encoding='utf-8')

          # Avoid accidentally closing an inline style element.
          main_css = main_css.replace('</style', '<\\/style')
          font_css = font_css.replace('</style', '<\\/style')
          mirror_css = mirror_css.replace('</style', '<\\/style')

          # Remove font preloads. font-display:swap already guarantees an immediate fallback.
          s = re.sub(r'<link\s+rel="preload"\s+href="/_next/static/media/[^"]+\.woff2[^>]*?>', '', s)

          # Replace the two render-blocking Next CSS requests with inline CSS.
          s, n_font = re.subn(
              r'<link\s+rel="stylesheet"\s+href="/_next/static/chunks/17jk821lzpjxj\.css[^"]*"[^>]*?>',
              '<style id="we-font-css-inline-v12">' + font_css + '</style>',
              s,
              count=1,
          )
          s, n_main = re.subn(
              r'<link\s+rel="stylesheet"\s+href="/_next/static/chunks/14xjhfymotqh9\.css[^"]*"[^>]*?>',
              '<style id="we-main-css-inline-v12">' + main_css + '</style>',
              s,
              count=1,
          )

          # Inline the tiny mirror override too, removing the final blocking stylesheet request.
          s, n_mirror = re.subn(
              r'<link\s+rel="stylesheet"\s+href="/mirror-fidelity\.css"\s*/?>',
              '<style id="we-mirror-css-inline-v12">' + mirror_css + '</style>',
              s,
              count=1,
          )

          # On modern browsers, hold the exported Next runtime until after first paint on mobile.
          # Static HTML remains visible and usable for normal links; any early interaction wakes it immediately.
          next_srcs = []
          script_re = re.compile(r'<script(?P<attrs>[^>]*\bsrc="(?P<src>/_next/static/chunks/[^"]+)"[^>]*)></script>')

          def strip_next_script(m):
              attrs = m.group('attrs')
              src = m.group('src')
              if re.search(r'\bnoModule\b|\bnomodule\b', attrs):
                  return m.group(0)
              if src not in next_srcs:
                  next_srcs.append(src)
              return ''

          s = script_re.sub(strip_next_script, s)

          loader = '''<script id="we-next-deferred-v12">(()=>{\n  const srcs=__SRCS__;\n  let started=false;\n  const start=()=>{\n    if(started)return; started=true;\n    for(const src of srcs){\n      const el=document.createElement('script');\n      el.src=src; el.async=true; el.fetchPriority='low';\n      (document.head||document.documentElement).appendChild(el);\n    }\n  };\n  if(!matchMedia('(max-width:767px)').matches){ start(); return; }\n  const wake=['pointerdown','touchstart','keydown','wheel','scroll'];\n  for(const ev of wake) addEventListener(ev,start,{once:true,passive:true});\n  if('requestIdleCallback' in window) requestIdleCallback(start,{timeout:3200});\n  else setTimeout(start,3000);\n})();</script>'''.replace('__SRCS__', json.dumps(next_srcs, separators=(',', ':')))

          s = s.replace('</body>', loader + '</body>', 1)

          after = len(s.encode('utf-8'))
          p.write_text(s, encoding='utf-8')

          print(f'font CSS inlined: {len(font_css.encode("utf-8"))} bytes; replacements={n_font}')
          print(f'main CSS inlined: {len(main_css.encode("utf-8"))} bytes; replacements={n_main}')
          print(f'mirror CSS inlined: {len(mirror_css.encode("utf-8"))} bytes; replacements={n_mirror}')
          print(f'Next runtime scripts deferred: {len(next_srcs)}')
          print(f'index.html: {before} -> {after} bytes')

          if not (n_font == 1 and n_main == 1 and n_mirror == 1):
              raise SystemExit('Expected stylesheet links were not found exactly once')
          if len(next_srcs) < 5:
              raise SystemExit('Unexpectedly few Next runtime scripts found; refusing partial optimization')
          PY

      - name: Commit optimized home
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: inline home css and defer mobile hydration"
          git push origin HEAD:test
