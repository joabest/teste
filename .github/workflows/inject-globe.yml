name: Inject standalone globe

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/inject-globe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - name: Patch homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/globe-fallback.js" defer></script>'
          if tag not in s:
              if '</body>' in s:
                  s = s.replace('</body>', tag + '</body>', 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inject-globe.yml
          git add index.html globe-fallback.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: enable standalone animated globe on homepage"
          git push origin test
