name: Performance HTML cleanup

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/perf-html-cleanup.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Remove obsolete render blockers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = 0
          for p in Path('.').rglob('*.html'):
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old = s

              # Old custom animation runtime: static globe now lives in globe-live-v6.js.
              s = s.replace('<script defer src="/home-fidelity-v4.js"></script>', '')
              s = s.replace('<script src="/home-fidelity-v4.js"></script>', '')

              # Do not preload/connect the original site's analytics on the clone.
              s = re.sub(r'<link[^>]+href="https://www\.googletagmanager\.com/gtag/js\?id=G-FKEY4ZRP0W"[^>]*/?>', '', s, flags=re.I)
              s = re.sub(r'<link[^>]+href="https://www\.googletagmanager\.com"[^>]*/?>', '', s, flags=re.I)
              s = re.sub(r'<link[^>]+href="https://www\.google-analytics\.com"[^>]*/?>', '', s, flags=re.I)
              s = re.sub(r'<script[^>]+src="https://www\.googletagmanager\.com/[^"]+"[^>]*></script>', '', s, flags=re.I)

              # The router helper does not need to block HTML parsing.
              s = s.replace('<script src="/static-router-fix.js"></script>', '<script defer src="/static-router-fix.js"></script>')

              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed += 1

          print(f'updated {changed} html files')
          PY

      - name: Commit optimized HTML
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: remove obsolete animation and analytics blockers"
          git push origin HEAD:test
