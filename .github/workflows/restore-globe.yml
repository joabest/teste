name: Restore globe assets

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/restore-globe.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Restore original globe files and permanently hide Awwwards badge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _next/static/chunks data
          curl -fL --retry 3 --retry-delay 2 'https://weevolveit.com/_next/static/chunks/0k1q0rnps5ilq.js' -o '_next/static/chunks/0k1q0rnps5ilq.js'
          curl -fL --retry 3 --retry-delay 2 'https://weevolveit.com/data/ne_110m_admin_0_countries.geojson' -o 'data/ne_110m_admin_0_countries.geojson'
          cat >> mirror-fidelity.css <<'EOF'

          /* Permanent mirror overrides. */
          a[href*="awwwards.com/sites/weevolveit"],
          a[aria-label*="Awwwards"],
          [data-awwwards],
          .awwwards-ribbon,
          .awwwards-badge { display: none !important; visibility: hidden !important; pointer-events: none !important; }
          EOF
          git rm --ignore-unmatch '.github/workflows/restore-globe.yml'

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore location-aware globe and remove Awwwards badge'
          git push origin HEAD:test
