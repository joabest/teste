name: Inject home fidelity v4

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/inject-home-fidelity-v4.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1

      - name: Inject globe and final particle effect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('index.html'), Path('es.html'), Path('es/index.html')]
          tag = '<script defer src="/home-fidelity-v4.js"></script>'
          changed = 0
          for f in targets:
              if not f.exists():
                  continue
              s = f.read_text(encoding='utf-8', errors='ignore')
              s = re.sub(r'<script[^>]+src=["\']/globe-fallback\.js["\'][^>]*></script>', '', s, flags=re.I)
              s = re.sub(r'<script[^>]+src=["\']/home-fidelity-v4\.js["\'][^>]*></script>', '', s, flags=re.I)
              if '</body>' in s:
                  s = s.replace('</body>', tag + '</body>', 1)
              else:
                  s += tag
              f.write_text(s, encoding='utf-8')
              changed += 1
          print('Injected into', changed, 'home document(s)')
          PY
          rm -f .github/workflows/inject-home-fidelity-v4.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use high-fidelity globe and interactive evolve particles [skip ci]"
          git push origin test
