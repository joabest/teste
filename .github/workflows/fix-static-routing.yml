name: Fix static routing

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/fix-static-routing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1

      - name: Add hard-navigation fallback and exact Vercel rewrites
        shell: bash
        run: |
          cat > static-router-fix.js <<'JS'
          (() => {
            const isModified = (e) => e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0;

            document.addEventListener('click', (e) => {
              if (e.defaultPrevented || isModified(e)) return;
              const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
              if (!a) return;
              if (a.hasAttribute('download') || (a.target && a.target !== '_self')) return;

              const raw = a.getAttribute('href');
              if (!raw || raw.startsWith('#') || raw.startsWith('mailto:') || raw.startsWith('tel:') || raw.startsWith('javascript:')) return;

              let url;
              try { url = new URL(a.href, location.href); } catch { return; }
              if (url.origin !== location.origin) return;

              // Same-document anchors should keep native behavior.
              if (url.pathname === location.pathname && url.search === location.search && url.hash) return;

              // The original Next.js client router expects RSC/server responses that do not
              // exist in this static mirror. Force a normal document request instead.
              e.preventDefault();
              e.stopImmediatePropagation();
              location.assign(url.pathname + url.search + url.hash);
            }, true);

            // If a stale Next runtime throws while attempting a client transition,
            // recover by reloading the current clean URL once.
            let recovering = false;
            const recover = () => {
              if (recovering) return;
              recovering = true;
              const key = 'static-route-recovery:' + location.pathname + location.search;
              try {
                if (sessionStorage.getItem(key) === '1') return;
                sessionStorage.setItem(key, '1');
              } catch {}
              setTimeout(() => location.replace(location.pathname + location.search + location.hash), 20);
            };

            window.addEventListener('unhandledrejection', (e) => {
              const s = String((e.reason && (e.reason.message || e.reason)) || '');
              if (/ChunkLoadError|Failed to fetch dynamically imported module|RSC|flight|NEXT_REDIRECT/i.test(s)) recover();
            });
            window.addEventListener('error', (e) => {
              const s = String((e.error && (e.error.message || e.error)) || e.message || '');
              if (/ChunkLoadError|Loading chunk|dynamically imported module/i.test(s)) recover();
            }, true);
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          tag = '<script src="/static-router-fix.js"></script>'
          pages = []

          for f in root.rglob('*.html'):
              if '.git' in f.parts:
                  continue
              rel = f.as_posix()
              text = f.read_text(encoding='utf-8', errors='ignore')
              if 'static-router-fix.js' not in text:
                  if '</body>' in text:
                      text = text.replace('</body>', tag + '</body>', 1)
                  else:
                      text += tag
                  f.write_text(text, encoding='utf-8')

              if rel == 'index.html':
                  continue
              route = '/' + rel[:-5]  # strip .html
              pages.append((route, '/' + rel))

          # Exact rewrites make clean nested URLs deterministic on a static Vercel project.
          rewrites = [{'source': route, 'destination': dest} for route, dest in sorted(set(pages))]
          cfg = {
              'trailingSlash': False,
              'rewrites': rewrites,
              'headers': [
                  {
                      'source': '/static-router-fix.js',
                      'headers': [{'key': 'Cache-Control', 'value': 'public, max-age=0, must-revalidate'}]
                  }
              ]
          }
          Path('vercel.json').write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')
          print('Injected router fallback into', len(pages) + 1, 'HTML files')
          print('Generated', len(rewrites), 'exact Vercel rewrites')
          PY

          rm -f .github/workflows/fix-static-routing.yml

      - name: Commit routing fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: prevent Vercel 404s during static navigation [skip ci]"
          git push origin test
