name: Repair live frontend

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/repair-live-frontend.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1

      - name: Sync current WeEvolveIT frontend and assets
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import html as htmlmod
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE = 'https://weevolveit.com'
          ROOT = Path('.')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
          MAX_FILE = 30 * 1024 * 1024
          TIMEOUT = 30

          def fetch(url: str, binary=True):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Accept': '*/*',
                  'Referer': BASE + '/',
              })
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                          data = r.read(MAX_FILE + 1)
                          if len(data) > MAX_FILE:
                              print('SKIP too large', url, len(data))
                              return None
                          return data
                  except Exception as e:
                      if attempt == 2:
                          print('MISS', url, repr(e))
                          return None
                      time.sleep(1.2 * (attempt + 1))

          def safe_local_path(url_or_path: str):
              try:
                  p = urllib.parse.urlparse(url_or_path).path
                  p = urllib.parse.unquote(p)
              except Exception:
                  return None
              if not p.startswith('/'):
                  return None
              rel = p.lstrip('/')
              if not rel or '..' in Path(rel).parts:
                  return None
              return ROOT / rel

          IMAGE_QUERY_RE = re.compile(r'/_next/image\?url=([^"\'<>\s]+)')
          IMAGE_QUERY_ESC_RE = re.compile(r'/_next/image\\?url=([^"\'<>\s]+)')

          def decode_image_target(token: str):
              # token may contain normal &, HTML &amp;, or React flight unicode separators.
              token = htmlmod.unescape(token)
              token = token.replace('\\u0026', '&').replace('%26', '&')
              encoded = token.split('&', 1)[0]
              try:
                  target = urllib.parse.unquote(encoded)
              except Exception:
                  return None
              if not target.startswith('/') or target.startswith('//'):
                  return None
              if '..' in Path(target.lstrip('/')).parts:
                  return None
              return target

          def deoptimize_images(text: str, discovered: set[str]):
              # Replace optimizer URLs by their public raw source so a static Vercel project
              # does not depend on a Next.js image server route.
              def repl(m):
                  target = decode_image_target(m.group(1))
                  if not target:
                      return m.group(0)
                  discovered.add(target)
                  return target
              text = IMAGE_QUERY_RE.sub(repl, text)
              text = IMAGE_QUERY_ESC_RE.sub(repl, text)
              return text

          STATIC_RE = re.compile(r'/_next/static/[A-Za-z0-9._~!$&()*+,;=:@%/\-]+')
          ATTR_RE = re.compile(r'''(?:src|href|poster|content)=["']([^"']+)["']''', re.I)
          SRCSET_RE = re.compile(r'''(?:srcset|imagesrcset)=["']([^"']+)["']''', re.I)
          CSS_URL_RE = re.compile(r'url\(([^)]+)\)', re.I)

          ASSET_EXTS = {
              '.js','.css','.woff','.woff2','.ttf','.otf','.eot',
              '.png','.jpg','.jpeg','.webp','.avif','.gif','.svg','.ico',
              '.mp4','.webm','.mov','.json','.txt','.xml'
          }

          def is_asset_path(p: str):
              path = urllib.parse.urlparse(p).path
              if path.startswith('/_next/static/'):
                  return True
              ext = Path(path).suffix.lower()
              return ext in ASSET_EXTS or path.startswith(('/logos/','/images/','/fonts/','/videos/','/media/'))

          def normalize_local_url(u: str, base_url: str):
              u = htmlmod.unescape(u.strip().strip('"\''))
              u = u.replace('\\u0026', '&')
              if not u or u.startswith(('data:','blob:','mailto:','tel:','javascript:','#')):
                  return None
              absu = urllib.parse.urljoin(base_url, u)
              parsed = urllib.parse.urlparse(absu)
              if parsed.netloc and parsed.netloc != 'weevolveit.com':
                  return None
              if not parsed.path.startswith('/'):
                  return None
              return BASE + parsed.path + (('?' + parsed.query) if parsed.query else '')

          def discover_assets(text: str, base_url: str, out: set[str]):
              for m in STATIC_RE.finditer(text):
                  out.add(BASE + m.group(0).split('?',1)[0])
              for raw in ATTR_RE.findall(text):
                  u = normalize_local_url(raw, base_url)
                  if u and is_asset_path(u): out.add(u)
              for rawset in SRCSET_RE.findall(text):
                  for part in rawset.split(','):
                      raw = part.strip().split(' ')[0]
                      u = normalize_local_url(raw, base_url)
                      if u and is_asset_path(u): out.add(u)

          def route_to_file(route: str):
              route = route.split('?',1)[0].split('#',1)[0]
              route = urllib.parse.unquote(route)
              if route in ('','/'):
                  return ROOT / 'index.html'
              rel = route.strip('/')
              if not rel:
                  return ROOT / 'index.html'
              candidates = [ROOT / (rel + '.html'), ROOT / rel / 'index.html']
              for c in candidates:
                  if c.exists(): return c
              return candidates[0]

          # Fixed routes are guaranteed even if a sitemap fetch is incomplete.
          routes = {
              '/', '/method', '/case-studies', '/contact', '/reviews', '/about', '/blog',
              '/business-diagnosis', '/ai-visibility-check', '/free-seo-check', '/es'
          }

          sm = fetch(BASE + '/sitemap.xml')
          if sm:
              try:
                  root = ET.fromstring(sm)
                  for el in root.iter():
                      if el.tag.endswith('loc') and el.text:
                          u = urllib.parse.urlparse(el.text.strip())
                          if u.netloc == 'weevolveit.com' and u.path:
                              routes.add(u.path)
              except Exception as e:
                  print('SITEMAP parse error', e)

          # Avoid runaway mirrors while still covering the site's public static routes.
          routes = sorted(routes, key=lambda x: (x.count('/'), x))[:180]
          print('Routes:', len(routes))

          assets: set[str] = set()
          raw_image_paths: set[str] = set()
          synced_pages = 0

          for route in routes:
              url = BASE + route
              data = fetch(url)
              if not data:
                  continue
              ctype_text = None
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              if '<html' not in text.lower() and '<!doctype' not in text.lower():
                  continue
              text = deoptimize_images(text, raw_image_paths)
              discover_assets(text, url, assets)
              out = route_to_file(route)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(text, encoding='utf-8')
              synced_pages += 1
              print('PAGE', route, '->', out)

          for p in raw_image_paths:
              assets.add(BASE + p)

          # Include assets referenced by the already mirrored HTML/CSS/JS as well.
          for ext in ('*.html','*.css','*.js'):
              for f in ROOT.rglob(ext):
                  if '.git' in f.parts:
                      continue
                  try:
                      text = f.read_text(encoding='utf-8', errors='ignore')
                  except Exception:
                      continue
                  more_raw = set()
                  new_text = deoptimize_images(text, more_raw)
                  if new_text != text:
                      f.write_text(new_text, encoding='utf-8')
                  for p in more_raw:
                      assets.add(BASE + p)
                  discover_assets(new_text, BASE + '/', assets)

          # Recover clean aliases for HTTrack files saved with literal query suffixes.
          for f in list(ROOT.rglob('*')):
              if not f.is_file() or '.git' in f.parts:
                  continue
              name = f.name
              if '?' in name:
                  clean = f.with_name(name.split('?',1)[0])
                  if clean.name and not clean.exists():
                      try:
                          clean.write_bytes(f.read_bytes())
                          print('ALIAS', f, '->', clean)
                      except Exception as e:
                          print('ALIAS fail', f, e)

          downloaded = 0
          queue = list(assets)
          seen = set()
          while queue and len(seen) < 3500:
              url = queue.pop(0)
              if url in seen:
                  continue
              seen.add(url)
              parsed = urllib.parse.urlparse(url)
              # _next/image should already have been converted to raw assets.
              if parsed.path == '/_next/image':
                  continue
              local = safe_local_path(url)
              if local is None:
                  continue
              # Existing nonempty assets are kept unless absent. HTML was explicitly synced above.
              if local.exists() and local.stat().st_size > 0:
                  data = local.read_bytes()
              else:
                  data = fetch(url)
                  if not data:
                      continue
                  local.parent.mkdir(parents=True, exist_ok=True)
                  local.write_bytes(data)
                  downloaded += 1
                  print('ASSET', parsed.path, len(data))

              # Crawl references inside downloaded text assets. This catches CSS fonts/images
              # and many Next/Turbopack lazy chunk references.
              if local.suffix.lower() in ('.css','.js'):
                  try:
                      text = data.decode('utf-8', errors='ignore')
                  except Exception:
                      text = ''
                  for m in STATIC_RE.finditer(text):
                      queue.append(BASE + m.group(0).split('?',1)[0])
                  if local.suffix.lower() == '.css':
                      for raw in CSS_URL_RE.findall(text):
                          u = normalize_local_url(raw, url)
                          if u and is_asset_path(u): queue.append(u)

          # Static Vercel routing for mirrored .html pages.
          vercel = ROOT / 'vercel.json'
          vercel.write_text('''{\n  "cleanUrls": true,\n  "trailingSlash": false\n}\n''', encoding='utf-8')

          # Safety fallback for logo color interaction in case the original stylesheet rule
          # is delayed or omitted from a mirrored route.
          fallback_css = ROOT / 'mirror-fidelity.css'
          fallback_css.write_text('''
          /* Mirror fidelity fallbacks. Original app CSS remains authoritative. */
          img[src*="/logos/clients/"] { filter: grayscale(1); opacity: .72; transition: filter .25s ease, opacity .25s ease; }
          img[src*="/logos/clients/"]:hover { filter: grayscale(0); opacity: 1; }
          ''', encoding='utf-8')

          # Append fallback stylesheet to pages once.
          for f in ROOT.rglob('*.html'):
              if '.git' in f.parts:
                  continue
              try:
                  text = f.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              if 'mirror-fidelity.css' not in text and '</head>' in text:
                  text = text.replace('</head>', '<link rel="stylesheet" href="/mirror-fidelity.css"></head>', 1)
                  f.write_text(text, encoding='utf-8')

          print('Synced pages:', synced_pages)
          print('Assets discovered:', len(seen), 'downloaded:', downloaded)
          PY

      - name: Commit repaired frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/repair-live-frontend.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore live interactions and frontend assets [skip ci]"
          git push origin HEAD:test
