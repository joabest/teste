name: Import WeEvolveIT mirror

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/import-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack rsync

      - name: Mirror WeEvolveIT
        run: |
          rm -rf /tmp/weevolve-mirror
          mkdir -p /tmp/weevolve-mirror
          httrack 'https://weevolveit.com/' \
            -O '/tmp/weevolve-mirror' \
            '+*.png' '+*.gif' '+*.jpg' '+*.jpeg' '+*.css' '+*.js' \
            '-ad.doubleclick.net/*' '-mime:application/foobar' \
            -q -C2 -p3 -A25000 \
            -F 'Mozilla/4.5 (compatible; HTTrack 3.0x; Windows 98)' \
            || true

      - name: Copy mirrored website to repository root
        run: |
          test -f /tmp/weevolve-mirror/weevolveit.com/index.html
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/weevolve-mirror/weevolveit.com/ ./

      - name: Commit imported site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import extracted WeEvolveIT website'
          git push origin test
