name: Apply mirror visual fixes

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/apply-mirror-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Apply patch
        run: python scripts/apply_mirror_fixes.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror-ui-fixes.js globe-fallback.js footer-particle-fallback.js next-stability-guard.js mirror-fidelity.css
          git commit -m "fix: restore globe tools logos and particle object" || exit 0
          git push origin test
