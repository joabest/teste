name: Mobile payload optimizer v11
on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/perf-mobile-v11.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - name: Reduce HTML payload and deprioritize non-critical JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlparse, parse_qs
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=len(s.encode('utf-8'))

          # 1) Unwrap static Next image-optimizer URLs to their real source.
          def unwrap_src(m):
              raw=m.group(1)
              try:
                  # raw is HTML attribute text, so only simple &amp; normalization is needed.
                  q=raw.replace('&amp;','&')
                  if not q.startswith('/_next/image?'):
                      return m.group(0)
                  params=parse_qs(urlparse(q).query)
                  inner=params.get('url',[None])[0]
                  if not inner:
                      return m.group(0)
                  inner=unquote(inner)
                  if inner.startswith('/') or inner.startswith('http://') or inner.startswith('https://'):
                      return 'src="'+inner.replace('&','&amp;').replace('"','&quot;')+'"'
              except Exception:
                  pass
              return m.group(0)
          s=re.sub(r'src="([^"]*?/_next/image\?[^"]+)"', unwrap_src, s)

          # 2) Remove generated responsive candidate lists. In this mirror they are
          # redundant and massively inflate HTML; src remains as the canonical image.
          s=re.sub(r'\s+srcSet="[^"]*"', '', s)
          s=re.sub(r'\s+srcset="[^"]*"', '', s)
          s=re.sub(r'\s+sizes="[^"]*"', '', s)

          # 3) Remove the non-critical script preload; the runtime can request it when needed.
          s=re.sub(r'<link\s+rel="preload"\s+as="script"[^>]*?>', '', s)

          # 4) Let CSS/fonts win network priority on slow mobile. Chunks still load and execute.
          def lowprio(m):
              tag=m.group(0)
              if 'fetchpriority=' not in tag.lower():
                  tag=tag[:-1]+' fetchpriority="low">'
              return tag
          s=re.sub(r'<script\s+src="/_next/static/chunks/[^"]+"\s+async=""[^>]*>', lowprio, s)

          after=len(s.encode('utf-8'))
          p.write_text(s, encoding='utf-8')
          print(f'index.html: {before} -> {after} bytes ({before-after} bytes removed)')
          PY
      - name: Commit optimized HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: reduce home HTML payload and prioritize critical resources"
          git push origin HEAD:test
